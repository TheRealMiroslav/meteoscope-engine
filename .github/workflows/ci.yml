name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Stage 1: Code Style & Static Linting
  # ============================================================================
  lint:
    name: Code Formatting & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run C++ Linter & Clang-Format
        uses: cpp-linter/cpp-linter-action@v2
        id: linter
        with:
          style: file
          tidy-checks: ''
          files-changed-only: false
          step-summary: true

  # ============================================================================
  # Stage 2: Multi-Platform Build & Verification Matrix
  # ============================================================================
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.build_type }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libtbb-dev

      - name: Setup CCache Acceleration
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.os }}-${{ matrix.build_type }}
          max-size: 500M

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Compile Executable
        run: |
          cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Verify CLI Execution (Linux)
        if: runner.os == 'Linux'
        run: |
          # The binary expects arguments; without args it prints usage and exits with error code.
          # We verify that the executable launches and outputs the expected usage syntax.
          ./build/meteoscope 2>&1 | grep "Usage:" || exit 1

      - name: Verify CLI Execution (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = (& .\build\${{ matrix.build_type }}\meteoscope.exe 2>&1) | Out-String
          if ($output -notmatch "Usage:") {
            Write-Error "CLI smoke test failed: Expected usage banner not found"
            exit 1
          }

  # ============================================================================
  # Stage 3: Security & Vulnerability Scan
  # ============================================================================
  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability & Secret Scanner
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
